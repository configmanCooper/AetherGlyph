services:
  - type: web
    name: aetherglyph
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://aetherglyph.onrender.com,https://configmancooper.github.io"
      # This full-game service hosts the web client. Production packaged/public
      # clients use the separate https://aetherglyph-server.onrender.com service
      # for authoritative matchmaking and duels.
